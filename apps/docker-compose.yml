# Puertos en el host: 5432 queda libre para un PostgreSQL instalado en el equipo (si lo hay).
#   db       -> 5433  base de desarrollo (la que usa apps/api/.env)
#   db_test  -> 5434  base de los tests e2e (se borra al detenerla: vive en memoria)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: becados
      POSTGRES_PASSWORD: becados
      POSTGRES_DB: becados
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: becadozzz
      POSTGRES_PASSWORD: becadozzz
      POSTGRES_DB: becados_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
volumes:
  pgdata:
