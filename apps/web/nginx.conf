# nginx del sitio ResiBreak (ver apps/web/Dockerfile).
# HTTPS: poner delante el proxy del servidor con el certificado (la app web lo necesita en producción).
server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # API (solo alcanzable a través de nginx)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # App web de residentes y proveedores (Expo). Es una SPA: toda ruta desconocida carga index.html.
  location = /app {
    return 301 /app/;
  }
  location ^~ /app/_expo/ {
    alias /usr/share/nginx/app/_expo/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location ^~ /app/ {
    alias /usr/share/nginx/app/;
    try_files $uri $uri/ /app/index.html;
  }
  # index.html y el manifiesto sin caché, para que una nueva versión llegue al recargar.
  location = /app/index.html {
    alias /usr/share/nginx/app/index.html;
    add_header Cache-Control "no-cache";
  }

  # Web de administración (Vite, SPA)
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
