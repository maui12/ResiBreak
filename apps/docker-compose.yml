services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: becados
      POSTGRES_PASSWORD: becados
      POSTGRES_DB: becados
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: becadozzz
      POSTGRES_PASSWORD: becadozzz
      POSTGRES_DB: becados_test
    ports:
      - "5433:5432"
    tmpfs:
    - /var/lib/postgresql/data
volumes:
  pgdata:
